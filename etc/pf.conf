# =========================================================================
# 1. MACROS 
# =========================================================================
ext_if = "wifibox0"
int_if = "bridge0"
localnet = "192.168.100.0/24"

# =========================================================================
# 2. OPTIONS 
# =========================================================================
set skip on lo0
set skip on bridge0

# =========================================================================
# 3. TRANSLATION 
# =========================================================================
nat on $ext_if from $localnet to any -> ($ext_if)

# =========================================================================
# 4. FILTERING 
# =========================================================================
pass in quick on $int_if from $localnet to any
pass out quick on $ext_if from any to any
