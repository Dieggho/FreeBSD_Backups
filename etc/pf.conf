# === This file is automatically generated by Sylve, don't edit! ===

#nat-anchor "sylve/nat-rules" all
#rdr-anchor "sylve/nat-rules" all
#binat-anchor "sylve/nat-rules" all
#
#anchor "sylve/nat-rules"
#load anchor "sylve/nat-rules" from "/etc/pf.sylve/nat-rules.conf"
#
#anchor "sylve/traffic-rules"
#load anchor "sylve/traffic-rules" from "/etc/pf.sylve/traffic-rules.conf"

# =========================================================================
# 1. MACROS (Definição de Variáveis)
# =========================================================================
ext_if = "wifibox0"
int_if = "bridge0"
localnet = "192.168.100.0/24"

# =========================================================================
# 2. OPTIONS (Opções e Ignorar Interfaces)
# =========================================================================
set skip on lo0
set skip on bridge0

# =========================================================================
# 3. TRANSLATION (Regras de NAT)
# =========================================================================
nat on $ext_if from $localnet to any -> ($ext_if)

# =========================================================================
# 4. FILTERING (Regras de Filtro)
# =========================================================================
pass in quick on $int_if from $localnet to any
pass out quick on $ext_if from any to any
