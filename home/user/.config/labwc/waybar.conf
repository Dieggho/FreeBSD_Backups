{
    "output": ["eDP-1"],
    "spacing": 4,
		// try to keep it 4px across the config
    "height":33,
    // "margin-left": 4,
    // "margin-right": 4,
    // "margin-top": 4,
    // "margin-radius": 4,
    // "layer": "top",
    "modules-left": [ "custom/space","custom/menu", "custom/appswitch", "ext/workspaces" ],
    "modules-right": ["cpu", "memory", "battery", "battery#bat1", "clock", "custom/wifi", "pulseaudio", "custom/session","custom/space2"],
    "battery": {
        "format": "{icon} {capacity}% ",
	"interval": 10,
    },
   
	"custom/menu": {
        "format":"              ",
        "tooltip": false,
        "on-click": "/home/void/.sh/wenu",
        "on-click-middle": "pkill fuzzel",
        "on-click-right": "pkill fuzzel",
    },

	"custom/appswitch": {
        "format":"   App Switcher   ",
        "tooltip": false,
        "on-click": "/home/void/.sh/appswitch",
        "on-click-middle": "pkill fuzzel",
        "on-click-right": "pkill fuzzel",
        "on-scroll-up": "wtype -M logo -k 8 -m logo",
        "on-scroll-down": "wtype -M logo -k 9 -m logo",
    },

   "ext/workspaces": {
    "format": "   {name}   ",
    "sort-by-id": true,
    "on-click": "activate",
    "on-scroll-up": "wtype -M logo -k 8 -m logo",
    "on-scroll-down": "wtype -M logo -k 9 -m logo",
   },


    "clock": {
        // "timezone": "America/Sao_Paulo",
        // "tooltip-format": "<big>[{:%Y %B}]</big>\n<tt><small>{calendar}</small></tt>",
        "format": " {:%A %d %B %Y     %T}",
	"interval": 1,
	"on-click": "gsimplecal",
    },

    "cpu": {
        "format": " {usage}%",
        "on-click": "foot -a SmartTerm -e htop -u void",
	"interval": 1,
    },

    "memory": {
        "format": " {percentage}%",
        "on-click": "foot -a SmartTerm -e htop -u void",
	"interval": 1,
    },

    "battery": {
	"bat": "BAT0",
        "format": " {capacity}%",
	"interval": 1,
    },

    "battery#bat1": {
	"bat": "BAT1",
        "format": " {capacity}%",
	"interval": 1,
    },

   "pulseaudio": {
         "format": "{icon} {volume}%",
         "format-bluetooth": "{icon} {volume}%",
         "format-muted": "",
         "format-icons": {
              "headphones": "",
              "handsfree": "",
              "headset": "",
              "phone": "",
              "portable": "",
              "car": "",
              "default": [" ", "  "]
             },
         "on-scroll-up": "pamixer -i 5",
         "on-scroll-down": "pamixer -d 5",
         "on-click": "pavucontrol",
     },

"custom/wifi": {
    "exec": "wifi.sh",
    "interval": 1,
    "format": "{}",
    "tooltip": false,
    "on-click": "wifimgr",
},

	"custom/session": {
        "format": " ⏻  ",
        "tooltip": false,
        "on-click": "/home/void/.sh/wsession",
        "on-click-right": "pkill wofi",
    },

	"custom/space": {
        "format": "  ",
        "tooltip": false,
     },

	"custom/space2": {
        "format": "",
        "tooltip": false,
     },
}
