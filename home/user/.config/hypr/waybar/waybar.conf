{
    "output": ["eDP-1"],
    "spacing": 4,
	// try to keep it 4px across the config
    "height":33,
    "margin-left": 6,
    "margin-right": 6,
    "margin-top": 6,
    //"margin-bottom": 6,
    "margin-radius": 20,
    //"layer": "top",
    "modules-left": ["custom/menu", "hyprland/workspaces"],
    "modules-right": ["cpu", "memory", "battery", "battery#bat1", "clock", "custom/wifi", "custom/audio", "custom/session", "custom/space"],
    "battery": {
        "format": "{icon} {capacity}% ",
	"interval": 10,
    },
   
	"custom/menu": {
        "format": "               ",
        "tooltip": false,
        "on-click": "sleep 0.1 && /home/void/.sh/wenu",
        "on-click-middle": "sleep 0.1 && foot",
        "on-click-right": "hyprctl dispatch fullscreen 1",
       "on-scroll-up": "hyprctl dispatch movewindow l",
       "on-scroll-down": "hyprctl dispatch movewindow r",
    },

    "hyprland/workspaces": {
	"format": "   {icon}   ",
	"format-icons": {
		"1":"Main",
		"2":"Web",
		"3":"Net",
		"4":"Doc",
		"5":"Term",
		"6":"Media",
		"7":"Desk",
	},
       "on-scroll-up": "hyprctl dispatch workspace -1",
       "on-scroll-down": "hyprctl dispatch workspace +1",
       "persistent-workspaces": {
             "*": 7, 
       },
     },


     "hyprland/window":{
     "on-click-middle": "hyprctl dispatch killactive",
     "on-scroll-up": "hyprctl dispatch movefocus u",
     "on-scroll-down": "hyprctl dispatch movefocus ",
     "on-click": "sleep 0.1 && top_level_mgr",
     "on-click-right": "sleep 0.1 && move_top_level_to",
     "max-length": 100,
     "width" : 0,
     },

    "clock": {
        // "timezone": "America/Sao_Paulo",
        // "tooltip-format": "<big>[{:%Y %B}]</big>\n<tt><small>{calendar}</small></tt>",
        "format": " {:%A %d %B %Y     %T}",
	"interval": 1,
	"on-click": "gsimplecal",
    },

    "cpu": {
        "format": " {usage}%",
        "on-click": "foot -a SmartTerm -e htop -u void",
	"interval": 1,
    },

    "memory": {
        "format": " {percentage}%",
        "on-click": "foot -a SmartTerm -e htop -u void",
	"interval": 1,
    },

    "battery": {
	"bat": "BAT0",
        "format": " {capacity}%",
	"interval": 1,
    },

    "battery#bat1": {
	"bat": "BAT1",
        "format": " {capacity}%",
	"interval": 1,
    },

"custom/audio": {
    "exec": "vol",
    "interval": 1,
    "format": "{}",
    "tooltip": false,
    "on-scroll-up": "pamixer -i 5",
    "on-scroll-down": "pamixer -d 5",
    "on-click": "pavucontrol",
},

"custom/wifi": {
    "exec": "wifi.sh",
    "interval": 1,
    "format": "{}",
    "tooltip": false,
    "on-click": "wifimgr",
},


	"custom/session": {
        "format": " ⏻ ",
        "tooltip": false,
        "on-click": "/home/void/.config/hypr/wsession",
        "on-click-right": "hyprctl dispatch killactive",
        "on-click-middle": "wlrctl window close",
        "on-scroll-up": "hyprctl dispatch movewindow u",
        "on-scroll-down": "hyprctl dispatch movewindow d",
    },

    	"custom/space": {
        "format": " ",
        "tooltip": false,
     },
}
