{
    "output": ["eDP-1"],
    "spacing": 4,
	// try to keep it 4px across the config
    "height":33,
    "margin-left": 6,
    "margin-right": 6,
    "margin-top": 6,
    //"margin-bottom": 6,
    "margin-radius": 20,
    //"layer": "top",
    "modules-left": ["custom/menu", "hyprland/workspaces"],
    "modules-center": [""],
    "modules-right": ["custom/keys", "cpu", "memory", "battery", "battery#bat1", "clock", "pulseaudio", "custom/session"],
    "battery": {
        "format": "{icon} {capacity}% ",
	"interval": 10,
    },
   
	"custom/menu": {
        "format": "               ",
        "tooltip": false,
        "on-click": "sleep 0.1 && /home/void/.sh/wenu",
        "on-click-middle": "sleep 0.1 && foot",
        "on-click-right": "sleep 0.1 && foot -a SmartTerm",
       "on-scroll-up": "hyprctl dispatch movewindow l",
       "on-scroll-down": "hyprctl dispatch movewindow r",
    },

    "hyprland/workspaces": {
	"format": "   {icon}   ",
	"format-icons": {
		"1":"Main",
		"2":"Web",
		"3":"Net",
		"4":"Doc",
		"5":"Term",
		"6":"Media",
		"7":"Desk",
	},
       "on-scroll-up": "hyprctl dispatch workspace -1",
       "on-scroll-down": "hyprctl dispatch workspace +1",
       "persistent-workspaces": {
             "*": 7, 
       },
     },


     "hyprland/window":{
     "on-click-middle": "hyprctl dispatch killactive",
     "on-scroll-up": "hyprctl dispatch movefocus u",
     "on-scroll-down": "hyprctl dispatch movefocus ",
     "on-click": "sleep 0.1 && top_level_mgr",
     "on-click-right": "sleep 0.1 && move_top_level_to",
     "max-length": 100,
     "width" : 0,
     },

    "clock": {
        // "timezone": "America/Sao_Paulo",
        // "tooltip-format": "<big>[{:%Y %B}]</big>\n<tt><small>{calendar}</small></tt>",
        "format": " {:%A %d %B %Y     %T}",
	"interval": 1,
	"on-click": "gsimplecal",
    },

    "cpu": {
        "format": " {usage}%",
        "on-click": "lxtask",
	"interval": 1,
    },

    "memory": {
        "format": " {percentage}%",
        "on-click": "lxtask",
	"interval": 1,
    },

    "battery": {
	"bat": "BAT0",
        "format": " {capacity}%",
	"interval": 1,
    },

    "battery#bat1": {
	"bat": "BAT1",
        "format": " {capacity}%",
	"interval": 1,
    },

    "custom/alsa": {
        "exec": "echo  `vol`%",
        "on-click": "pavucontrol",
        "on-scroll-up": "pactl set-sink-volume $SINK +1%; pkill -x -RTMIN+11 waybar",
        "on-scroll-down": "pactl set-sink-volume $SINK -1%; pkill -x -RTMIN+11 waybar",
        "signal": 11,
        "interval": 1,
        "tooltip": false
    },

    "pulseaudio": {
         "format": "{icon} {volume}%",
         "format-bluetooth": "{icon} {volume}%",
         "format-muted": "",
         "format-icons": {
              "headphones": "",
              "handsfree": "",
              "headset": "",
              "phone": "",
              "portable": "",
              "car": "",
              "default": [" ", "  "]
             },
         "on-scroll-up": "pamixer -i 5",
         "on-scroll-down": "pamixer -d 5",
         "on-click": "pavucontrol",
     },

	"custom/session": {
        "format": " ⏻ ",
        "tooltip": false,
        "on-click": "/home/void/.config/hypr/wsession",
        "on-click-right": "hyprctl dispatch killactive",
        "on-click-middle": "hyprctl dispatch fullscreen 1",
        "on-scroll-up": "hyprctl dispatch movewindow u",
        "on-scroll-down": "hyprctl dispatch movewindow d",
    },
}
